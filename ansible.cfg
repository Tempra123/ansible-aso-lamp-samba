[defaults]
# Usuario con el que Ansible entra a las maquinas remotas
remote_user = root
# Donde esta la lista de IP (asi no hace falta el archivo /etc/ansible/hosts)
inventory = inventory/hosts.ini
# Donde estan los roles (lamp, samba, postgresql)
roles_path = roles
# No pregunta "confias en esta maquina?" al conectar (ahorra tiempo)
host_key_checking = False
# OPTIMIZACION: trabaja con 10 maquinas a la vez en vez de 5 (valor por defecto)
forks = 10
# OPTIMIZACION: no recolecta datos de cada maquina al iniciar (gather_facts);
# el playbook no los usa, asi arranca mas rapido
gathering = explicit
# OPTIMIZACION: si una maquina no responde, se rinde a los 5 segundos
# (por defecto espera 10) y sigue con las demas
timeout = 5
# Detecta python automaticamente sin mostrar avisos
interpreter_python = auto_silent
# No crea archivos .retry cuando falla algo
retry_files_enabled = False
# Muestra la salida mas ordenada y facil de leer (formato yaml)
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
# OPTIMIZACION: ejecuta cada tarea con menos pasos por SSH (menos viajes de red)
pipelining = True
# OPTIMIZACION: reutiliza la misma conexion SSH 60 segundos en vez de
# abrir una nueva por cada tarea
# OPTIMIZACION: ConnectTimeout=5 y ConnectionAttempts=1 hacen que una IP caida
# falle en 5 segundos y sin reintentos
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=5 -o ConnectionAttempts=1
